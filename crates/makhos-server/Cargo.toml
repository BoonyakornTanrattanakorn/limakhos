[package]
name = "makhos-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Self-hosted multiplayer server, matchmaking, SQLite WAL archive, and Glicko-2 ratings for Limakhos"

[dependencies]
makhos-core = { path = "../makhos-core" }
makhos-tb = { path = "../makhos-tb" }
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }
rusqlite = { version = "0.32", features = ["bundled"] }
argon2 = "0.5"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"

[dev-dependencies]
http-body-util = "0.1"
tokio-tungstenite = "0.24"
tower = { version = "0.5", features = ["util"] }
